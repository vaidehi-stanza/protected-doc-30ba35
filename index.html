<script>
(function () {
  var pay = JSON.parse(document.getElementById("payload").textContent);
  var form = document.getElementById("f");
  var input = document.getElementById("p");
  var btn = document.getElementById("b");
  var msg = document.getElementById("m");

  function say(text, kind) {
    msg.textContent = text;
    if (kind) { msg.setAttribute("data-kind", kind); } else { msg.removeAttribute("data-kind"); }
  }
  function bytes(b64) {
    return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
  }

  if (!window.crypto || !crypto.subtle) {
    say("This browser cannot decrypt here: the page needs an https:// or localhost address.", "error");
    btn.disabled = true;
    return;
  }

  async function unlock(pass) {
    var enc = new TextEncoder();
    var material = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(pay.salt), iterations: pay.iter, hash: "SHA-256" },
      material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes(pay.iv) }, key, bytes(pay.ct)
    );
    return new TextDecoder().decode(plain);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pass = input.value;
    if (!pass) { say("Enter the passphrase.", "error"); return; }
    btn.disabled = true;
    say("Decrypting\u2026", "busy");
    // Yield so the busy state paints before the key derivation blocks.
    setTimeout(function () {
      unlock(pass).then(function (html) {
        document.open();
        document.write(html);
        document.close();
      }).catch(function () {
        btn.disabled = false;
        say("That passphrase did not work.", "error");
        input.select();
      });
    }, 30);
  });
})();
</script>
